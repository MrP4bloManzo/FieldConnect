services:
  - type: web
    name: fieldconnect-group
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fieldconnect-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_NAME
        value: Administrador
      - key: SEED_ADMIN_EMAIL
        value: admin@fieldconnect.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
databases:
  - name: fieldconnect-db
    plan: basic-256mb
