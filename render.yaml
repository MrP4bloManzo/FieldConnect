services:
  - type: web
    name: fieldconnect-group
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SCHEMA
        value: fieldconnect
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_NAME
        value: Administrador
      - key: SEED_ADMIN_EMAIL
        value: admin@fieldconnect.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DIRECTOR_EMAIL
        sync: false
      - key: SEED_DIRECTOR_PASSWORD
        sync: false
