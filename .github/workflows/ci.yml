name: Basic checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check src/server.js
      - run: node --check src/api.js
      - run: node --check src/fetch-router.js
      - run: node --check src/init-db.js
      - run: node --check public/app.js
      - run: node --check app.js
      - run: npm test
      - run: npm run build:edge
      - run: git diff --exit-code -- supabase/functions/fieldconnect-api/shared
